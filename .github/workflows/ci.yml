name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  # 1. Static analysis & format gate (non-mutating, baseline-policed)
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Case-sensitive path check (Docs/ vs docs/ collision only)
        run: |
          # The commit gate itself writes Docs/reviews/motto_review.md (capital D),
          # so the check must flag a true COLLISION (the same relative path under
          # both Docs/ and docs/) rather than any capital-D path.
          COLLISIONS=""
          for p in $(git ls-files | grep -E '(^|/)Docs/' || true); do
            lower="${p#Docs/}"
            lower="docs/${lower}"
            if git ls-files --error-unmatch "$lower" >/dev/null 2>&1; then
              COLLISIONS="$COLLISIONS $p"
            fi
          done
          if [ -n "$COLLISIONS" ]; then
            echo "::error::Case-colliding tracked paths found under both Docs/ and docs/:"
            echo "$COLLISIONS" | tr ' ' '\n' | head -20
            exit 1
          fi
          echo "OK: no Docs/ vs docs/ case collisions."
      - name: Analyzer debt gate (errors+warnings blocking, infos capped)
        run: bash tools/check_analyzer_baseline.sh
      - name: Format debt gate (net-new debt fails)
        run: bash tools/check_format_baseline.sh

  # 2. Firestore + Storage security rules tests (Node 22, matches Functions)
  firebase_rules:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            firestore-rules-test/package-lock.json
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Install rules-test dependencies
        run: npm --prefix firestore-rules-test ci
      - name: Run Firestore + Storage rules emulator tests
        run: npm --prefix firestore-rules-test run test:all:emulator

  # 3. Unit & widget tests (including Firebase init)
  test:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Run all tests
        run: flutter test --coverage --test-randomize-ordering-seed random

  # 3b. Firebase Functions gate (Node 22)
  functions:
    needs: analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json
      - name: Install Functions dependencies
        run: npm ci
      - name: Install Firebase CLI (for emulator tests)
        run: npm install -g firebase-tools
      - name: Lint + typecheck Functions
        run: npm run lint
      - name: Build Functions
        run: npm run build
      - name: Run Functions unit tests
        run: npm test
      - name: Run Functions emulator tests (http-guards, training-data)
        run: npm run test:emulator

  # 3. Golden tests
  golden:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: 'stable'
      # CI must never mutate tracked files (RELEASE-PROOF-01).
      # golden_toolkit is committed in pubspec.yaml; verify, don't add.
      - name: Verify golden_toolkit is committed (no pubspec mutation)
        run: |
          grep -q "golden_toolkit:" pubspec.yaml || {
            echo "::error::golden_toolkit missing from pubspec.yaml — commit it, CI will not run 'flutter pub add'."
            exit 1
          }
          echo "golden_toolkit present in pubspec.yaml."
      - name: Install dependencies
        run: flutter pub get
      - name: Verify no tracked-file drift after pub get
        run: |
          git diff --exit-code pubspec.yaml pubspec.lock || {
            echo "::error::pub get modified tracked files — commit pubspec.lock before pushing."
            exit 1
          }
      - name: Run golden tests
        run: flutter test --tags=golden

  # 4. Storybook visual diffs
  storybook:
    needs: golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install Storybook & diff tool
        run: |
          npm ci
      - name: Build Storybook snapshots
        run: npm run test:storybook
      - name: Upload Storybook diffs
        if: failure()
        run: echo "::error::Visual diff failures detected in Storybook"

  # 5. Eval harness — detect regressions in offline mode (safety-blocking)
  eval:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline eval
        run: |
          mkdir -p build/reports/eval
          python3 scripts/eval/run_classification_eval.py \
            --mode offline \
            --golden eval/classification/golden/golden_cases_v1.jsonl \
            --fixtures eval/classification/fixtures/provider_outputs_v1.jsonl \
            --output build/reports/eval/ci_eval_report.json
      - name: Check eval gate — safety failures are blocking
        run: |
          # Gate logic lives in tools/check_eval_gate.py (RELEASE-PROOF-01 Commit 4).
          # Hard gates: harness errors, no providers, safety_failures>0,
          # must_not_violations>0, strict-rate regression >5 points.
          python3 tools/check_eval_gate.py build/reports/eval/ci_eval_report.json
      - name: Upload eval report (artifact, not tracked source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-eval-report
          path: build/reports/eval/ci_eval_report.json

  # 6. Auto-merge on success
  automerge:
    needs: [ analyze, firebase_rules, functions, test, golden, storybook, eval ]
    if: github.event_name == 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/enable-pull-request-automerge@v2
        with:
          merge-method: squash
          pull-request-number: ${{ github.event.pull_request.number }}
          token: ${{ secrets.GITHUB_TOKEN }} 
