# Weekly check for stale municipal policy sources.
#
# Reads source metadata from tools/policy_source_manifest.json and checks
# remote sources for changes using the Dart checker. Generates a report and
# files an issue when sources changed or checks fail.

name: Policy Source Freshness Check

on:
  schedule:
    # Monday 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dart dependencies
        run: dart pub get

      - name: Check policy source freshness
        id: checker
        run: |
          set -euo pipefail

          echo "Running policy source freshness checker"
          dart run tools/check_policy_sources.dart | tee /tmp/policy_source_check.log

          if [ ! -f build/reports/policy_source_check/latest.json ]; then
            echo "report_missing=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os

          report_path = 'build/reports/policy_source_check/latest.json'
          with open(report_path, 'r', encoding='utf-8') as f:
              report = json.load(f)

          rows = report.get('rows', [])
          changed = [
              row for row in rows
              if row.get('changed') is True
          ]
          failed = [
              row for row in rows
              if row.get('status') not in ('ok', 'changed')
          ]

          changed_summary = ''.join(
              f"- {row.get('region')} ({row.get('pluginId')}): {row.get('sourceUrl')}\n"
              for row in changed
          )
          failed_summary = ''.join(
              f"- {row.get('region')} ({row.get('pluginId')}): "
              f"{row.get('status')} — {row.get('error', 'No details')} — {row.get('sourceUrl')}\n"
              for row in failed
          )

          output_path = os.environ['GITHUB_OUTPUT']
          with open(output_path, 'a', encoding='utf-8') as out:
              out.write(f"changed_count={len(changed)}\n")
              out.write(f"failed_count={len(failed)}\n")
              out.write(f"has_changes={'true' if changed else 'false'}\n")
              out.write(f"has_failures={'true' if failed else 'false'}\n")
              out.write('changed_summary<<EOF\n')
              out.write(changed_summary)
              out.write('EOF\n')
              out.write('failed_summary<<EOF\n')
              out.write(failed_summary)
              out.write('EOF\n')
          PY

      - name: Upload freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-source-check-report
          path: build/reports/policy_source_check/latest.json
          retention-days: 30

      - name: Upload checker logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-source-check-logs
          path: /tmp/policy_source_check.log
          retention-days: 30

      - name: File issue if stale/changed sources found
        if: steps.checker.outputs.has_changes == 'true' || steps.checker.outputs.has_failures == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const changed = `${{ steps.checker.outputs.changed_summary }}`.trim();
            const failed = `${{ steps.checker.outputs.failed_summary }}`.trim();
            const changedText = changed ? `## Source changes\n${changed}` : '';
            const failedText = failed ? `## Failed or unreachable checks\n${failed}` : '';
            const today = new Date().toISOString().split('T')[0];

            const body = [
              '## Policy Source Freshness Alert',
              '',
              changedText,
              failedText,
              '',
              '### Action required',
              '1. Visit each URL and check whether rules changed.',
              '2. If unchanged: update the `nextReviewDue` date in the city plugin metadata.',
              '3. If changed: update the plugin and related provenance metadata.',
              '',
              'See `docs/playbooks/CITY_RULES_RESEARCH.md` for the update process.',
            ].filter(Boolean).join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Policy] Source checks detected updates — ${today}`,
              body,
              labels: ['policy', 'maintenance'],
            });
